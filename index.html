<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание // Cyber</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#0c0405;--red:#e8333f;--red2:#7a1520;--cy:#5ef2ea;--ye:#f3e600;--tx:#ffb3b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Exo 2","Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000040 2px 3px);animation:flick 6s infinite}
body::after{content:"";position:fixed;left:0;right:0;height:80px;top:-80px;pointer-events:none;z-index:6;background:linear-gradient(#5ef2ea00,#5ef2ea18,#5ef2ea00);animation:scan 7s linear infinite}
@keyframes scan{to{top:100%}}
@keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.6}97%{opacity:.9}98%{opacity:.5}}
#app{min-height:100%;display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:radial-gradient(ellipse at 50% 0,#2a0a0e,#0c0405 65%)}
.top{display:flex;justify-content:space-between;color:var(--cy);font-size:14px;letter-spacing:1px}
.top b{color:#fff}
.hd{font-family:"Russo One","Exo 2",sans-serif;font-size:30px;letter-spacing:3px;color:var(--red);position:relative;display:inline-block;text-transform:uppercase;animation:gl 5s infinite}
.hd::before,.hd::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
.hd::before{color:var(--cy);animation:g1 3.2s infinite steps(1)}
.hd::after{color:var(--ye);animation:g2 2.7s infinite steps(1)}
@keyframes g1{0%,90%,100%{clip-path:inset(0 0 100% 0);transform:none}91%{clip-path:inset(10% 0 55% 0);transform:translate(-4px)}94%{clip-path:inset(60% 0 10% 0);transform:translate(3px)}}
@keyframes g2{0%,86%,100%{clip-path:inset(0 0 100% 0);transform:none}87%{clip-path:inset(50% 0 20% 0);transform:translate(4px)}92%{clip-path:inset(5% 0 70% 0);transform:translate(-3px)}}
@keyframes gl{0%,96%,100%{transform:none}97%{transform:skewX(8deg)}98%{transform:skewX(-6deg) translateX(3px)}}
.sub{color:var(--cy);font-size:12px;letter-spacing:3px;margin-top:-6px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:1px solid var(--red2);background:#1a070a;text-align:center;padding:10px 0;font-family:"Russo One",sans-serif;font-size:16px;cursor:pointer;color:var(--tx);position:relative}
.tab small{display:block;font-family:"Exo 2";font-size:10px;color:var(--cy);letter-spacing:1px;margin-top:2px}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}.tab.on small{color:#fff}
.tab.today::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;background:var(--ye)}
.place{font-size:13px;letter-spacing:2px;color:var(--cy);border-bottom:1px solid var(--red2);padding-bottom:6px}
#les{display:flex;flex-direction:column;gap:8px;flex:1}
.les{display:flex;align-items:center;gap:12px;padding:12px;border-left:4px solid var(--ye);background:#2a0a0e;position:relative;animation:in .35s both}
.les.now{outline:1px solid var(--cy);box-shadow:0 0 14px #5ef2ea55}
.les.now::after{content:"СЕЙЧАС";position:absolute;right:8px;top:4px;font-size:10px;color:var(--cy);letter-spacing:2px}
.tm{color:var(--ye);font-size:13px;line-height:1.3;min-width:62px;font-weight:600}
.nm{flex:1;font-family:"Russo One",sans-serif;font-size:17px;text-transform:uppercase;color:#fff;letter-spacing:1px}
.rm{color:var(--cy);font-size:14px;text-align:right;font-weight:600}
.zoom{border:1px solid var(--cy);padding:0 5px;font-size:11px}
.gap{height:22px;border-left:1px dashed var(--red2);margin-left:2px;color:#a55;font-size:11px;padding-left:10px;display:flex;align-items:center;letter-spacing:2px}
@keyframes in{0%{opacity:0;transform:translateX(-14px) skewX(10deg);filter:hue-rotate(90deg)}60%{opacity:1;transform:translateX(4px)}100%{transform:none}}
.shake{animation:shk .25s}
@keyframes shk{0%{transform:translate(3px,0);filter:hue-rotate(60deg)}33%{transform:translate(-3px,1px)}66%{transform:translate(2px,-1px)}100%{transform:none}}
.bot{display:flex;gap:8px;align-items:stretch;position:sticky;bottom:0;padding-top:6px}
.clock{background:var(--red);color:#fff;padding:10px 16px;font-family:"Russo One",sans-serif;font-size:20px;letter-spacing:2px}
.wait{flex:1;border:1px solid var(--red2);background:#14060a;display:flex;align-items:center;padding:0 12px;color:var(--cy);letter-spacing:2px;font-size:14px}
.grp{display:flex;gap:8px}.g{flex:1;text-align:center;padding:8px 0;border:1px solid var(--cy);color:var(--cy);font-family:"Russo One",sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer}.g.on{background:var(--cy);color:#000}
.sm{font-size:11px;color:var(--tx);opacity:.75;letter-spacing:.5px;margin-top:3px;font-family:"Exo 2";text-transform:none}
.zid{display:block;font-size:11px;margin-top:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body>
<div id="app">

["Пт","био",[["11:00","латинский","2112"],["12:00","анатомия","2112"],["13:00","анатомия","2112"],["14:00","анатомия","2112"],["15:00","анатомия","2112"]]]];
const B=[
["Пн","учхоз",[["9:00","Латинский язык","8134","10:50","Лаб · Жумакаева А. Н."],["11:00","Казахский (русский) язык","8216","12:50","СПЗ · Сматаев Т. Х."],["13:00","Политология и социология","8135","14:50","ЛЗ · Болатбеков Е.С."],null,["18:00","История Казахстана","Zoom|9217840513|П-5DRaLZ","18:50","Л · Жуман Г."]]],

const C=[

["Пт","учхоз",[["9:00","Культурология и психология","8122","9:50","СПЗ · Абдикаримова А.Ж."],["10:00","Культурология и психология","8122","10:50","СПЗ · Абдикаримова А.Ж."],["11:00","Казахский (русский) язык","8134, 8149","11:50","СПЗ · Сматаев Т.Х., Абикенов М.Т."],["12:00","Казахский (русский) язык","8134, 8149","12:50","СПЗ · Сматаев Т.Х., Абикенов М.Т."],["13:00","Иностранный язык А","8122","13:50","П · Мырзабек Д.М."],null,["16:00","Иностранный язык Б","8143","16:50","П · Тураров С.К."]]]];
const G={"26-13":C,"26-14":A,"26-15":B};
const $=id=>document.getElementById(id);
let grp="26-14";try{const v=localStorage.getItem("grp");if(G[v])grp=v}catch(e){}
const wd=(new Date().getDay()+6)%7;let day=wd<5?wd:0;
function R(first){
 const D=G[grp];
 $("sub").textContent="// БАЗА ДАННЫХ · ГРУППА "+grp;
 $("grp").innerHTML=Object.keys(G).map(g=>`<div class="g ${g==grp?"on":""}" data-g="${g}">${g}</div>`).join("");
 $("tabs").innerHTML=D.map((d,i)=>`<div class="tab ${i==day?"on":""} ${i==wd?"today":""}" data-d="${i}">${d[0].toUpperCase()}<small>${d[1].split(" ")[0].toUpperCase()}</small></div>`).join("");
 $("place").textContent="// "+D[day][1].toUpperCase();
 const n=new Date(),h=n.getHours()*60+n.getMinutes();
 $("les").innerHTML=D[day][2].map((l,i)=>{if(!l)return'<div class="gap">· · · ПЕРЕРЫВ · · ·</div>';
  const [a,b]=l[0].split(":").map(Number),st=a*60+b,en=l[3]||a+":50",[ea,eb]=en.split(":").map(Number);
  const live=day==wd&&h>=st&&h<ea*60+eb+1;
  let rm=l[2];
  if(rm=="зум")rm='<span class="zoom">ZOOM</span>';
  else if(rm.startsWith("Zoom|")){const z=rm.split("|");rm=`<span class="zoom">ZOOM</span><span class="zid">${z[1]}<br>${z[2]}</span>`}
  return`<div class="les ${live?"now":""}" style="animation-delay:${i*50}ms"><div class="tm">${l[0].padStart(5,"0")}<br>${en}</div><div class="nm">${l[1]}${l[4]?`<div class="sm">${l[4]}</div>`:""}</div><div class="rm">${rm}</div></div>`}).join("");
 if(!first){const e=$("app");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
}
function tick(){const n=new Date();$("clock").textContent=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
 $("today").textContent=n.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"}).toUpperCase()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-d],[data-g]");if(!t)return;
 if(t.dataset.g){grp=t.dataset.g;try{localStorage.setItem("grp",grp)}catch(x){}}else day=+t.dataset.d;R()});
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;
 const n=day+(dx<0?1:-1);if(n<0||n>4)return;day=n;R()},{passive:true});
